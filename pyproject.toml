[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-connection"
version = "0.1.0"
description = "Interpretable U.S. domestic flight connection probability MVP"
requires-python = ">=3.11"
dependencies = [
    "airportsdata==20260803",
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "pydantic>=2.9,<3",
    "tzdata>=2025.2,<2027",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["backend/flight_connection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
